# =============================================================================
# Argus MCPS — Bomba de Infusão IoT
# Configuração base Kas (substitui .gitmodules + bblayers.conf + local.conf)
# =============================================================================
header:
  version: 14

distro: poky

# =============================================================================
# Repositórios e Layers
# =============================================================================
# Cada repo é baixado e versionado pelo Kas.
# Os commits estão pinados nos hashes testados do branch scarthgap.
# Para atualizar, troque o commit pelo novo hash desejado.
# =============================================================================
repos:

  # Repositório local — a layer deste projeto
  this:
    layers:
      meta-infusion-pump:

  poky:
    url: "https://git.yoctoproject.org/poky"
    branch: scarthgap
    commit: 553530a8acce3b078473c0fa512246a3e84d46bf
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-raspberrypi:
    url: "https://git.yoctoproject.org/meta-raspberrypi"
    branch: scarthgap
    commit: 2c646d29912dcc873469a57b1c207e1549c5094d

  meta-openembedded:
    url: "https://git.openembedded.org/meta-openembedded"
    branch: scarthgap
    commit: e76bf51a92b41d4cb185fc164ae43a863910ccd1
    layers:
      meta-oe:
      meta-python:
      meta-networking:

  meta-rauc:
    url: "https://github.com/rauc/meta-rauc.git"
    branch: scarthgap
    commit: e9d65639be4d8f150fbc7435e2ea399e2671fde1

# =============================================================================
# local.conf
# =============================================================================
# Cada chave gera um bloco no local.conf final.
# O Kas gerencia MACHINE, DISTRO e CONF_VERSION automaticamente.
# =============================================================================
local_conf_header:

  # --- Imagem e Features ---
  features: |
    EXTRA_IMAGE_FEATURES ?= "debug-tweaks"
    IMAGE_FEATURES:append = " ssh-server-dropbear"
    IMAGE_FSTYPES += "wic.gz wic.bmap"

  # --- Caches compartilhados (downloads / sstate) ---
  # downloads/ e sstate-cache/ nao tem nada de especifico deste projeto.
  # Apontar varios projetos Yocto para os mesmos dois diretorios e o
  # melhor resultado possivel, nao um risco: o sstate acerta entre
  # projetos sempre que receita, arquitetura e assinatura coincidem, e
  # entrada que nao casa simplesmente nao e usada. Ate simultaneamente,
  # porque o bitbake usa lockfiles.
  #
  # ATENCAO ao "?=". Nao e estilo, e obrigatorio.
  #
  # O kas-container faz bind-mount dos caminhos que essas variaveis
  # nomeiam e reescreve as duas para /downloads e /sstate DENTRO do
  # container (forward_dir), passando-as ao bitbake via
  # BB_ENV_PASSTHROUGH_ADDITIONS (libkas.py). O bitbake importa o
  # passthrough ANTES de ler os .conf -- entao uma atribuicao "=" aqui
  # venceria a variavel do container, o sstate seria gravado num caminho
  # do filesystem efemero do container e descartado a cada --rm. Voce
  # teria um cache que parece existir e nunca acerta.
  #
  # Com "?=", o valor abaixo e so o fallback de quem builda sem os
  # caches externos configurados.
  caches: |
    DL_DIR ?= "${TOPDIR}/../downloads"
    SSTATE_DIR ?= "${TOPDIR}/../sstate-cache"

  # --- Build ---
  build: |
    USER_CLASSES ?= "buildstats"
    PATCHRESOLVE = "noop"
    INHERIT += "buildhistory"
    REPRODUCIBLE_MAIN_PACKAGE_STATIC_ID = "1"

  # --- Espaco em disco: rm_work ---
  # De longe a maior economia. Sem isso, tmp/work guarda o diretorio de
  # trabalho de TODA receita (fonte desempacotado + arvore de build) e
  # nada apaga: e o que faz um tmp passar de 150 GB. Com rm_work o work
  # de cada receita e removido assim que ela termina.
  #
  # Efeito colateral util: a classe tambem troca o BB_SCHEDULER para
  # "completion", que termina receitas em vez de espalha-las, derrubando
  # tambem o PICO de uso, nao so o total final.
  #
  # rm_work PURO, sem RM_WORK_EXCLUDE, porque aqui o objetivo declarado e
  # economia maxima de espaco. Excluir receita do rm_work e escolha de
  # projeto que verifica alegacao lendo o work/ -- nao e boa pratica
  # geral, e cada exclusao custa alguns GB.
  #
  # O que voce NAO perde mesmo com rm_work puro: a imagem final e os
  # artefatos ficam em tmp/deploy/, que o rm_work nao toca. Para
  # inspecionar o conteudo do rootfs, monte o .wic depois.
  #
  # O que voce perde: o rootfs ja montado em work/ e o .config construido
  # do kernel. Se precisar deles numa sessao especifica, descomente a
  # linha abaixo -- linux-raspberrypi e a metade cara das duas.
  rm_work: |
    INHERIT += "rm_work"
    # RM_WORK_EXCLUDE += "infusion-image linux-raspberrypi"

  # --- Espaco em disco: monitor ---
  # Isto NAO economiza nada. Muda o modo de falha: sem o monitor, disco
  # cheio no meio de um build derruba a sessao grafica junto, nao so o
  # bitbake.
  #
  # Limiares subidos de 1G/100M para 10G/3G. 1G de folga e pouco demais:
  # quando o bitbake percebe, as tasks ja em voo consomem isso e o disco
  # enche mesmo assim. Com 10G ele para de enfileirar task nova; com 3G
  # para na hora.
  #
  # HALT (nao ABORT): o bitbake renomeou e avisa no nome antigo.
  diskmon: |
    BB_DISKMON_DIRS ??= "\
        STOPTASKS,${TMPDIR},10G,100K \
        STOPTASKS,${DL_DIR},5G,100K \
        STOPTASKS,${SSTATE_DIR},5G,100K \
        STOPTASKS,/tmp,1G,100K \
        HALT,${TMPDIR},3G,1K \
        HALT,${DL_DIR},1G,1K \
        HALT,${SSTATE_DIR},1G,1K \
        HALT,/tmp,100M,1K"

  # --- Locale e Timezone ---
  locale: |
    DEFAULT_TIMEZONE = "America/Sao_Paulo"

  # --- Licenças ---
  licenses: |
    LICENSE_FLAGS_ACCEPTED:append = " synaptics-killswitch commercial"

  # --- Rede ---
  network: |
    DISTRO_FEATURES:append = " wifi"

  # --- Kernel ---
  kernel: |
    PREFERRED_VERSION_linux-raspberrypi = "6.1.%"
    KERNEL_IMAGETYPE = "zImage"

  # --- Systemd (substitui sysvinit) ---
  systemd: |
    INIT_MANAGER = "systemd"
    DISTRO_FEATURES:append = " systemd"
    DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
    VIRTUAL-RUNTIME_init_manager = "systemd"
    VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"
    SYSTEMD_AUTO_ENABLE:pn-wpa-supplicant = "enable"

  # --- Hardware: I2C, SPI, UART, PWM ---
  hardware: |
    ENABLE_I2C = "1"
    ENABLE_SPI_BUS = "1"
    ENABLE_UART = "1"
    ENABLE_PWM = "1"
    KERNEL_DEVICETREE:append = " overlays/pwm-2chan.dtbo"
    IMAGE_INSTALL:append = " kernel-devicetree"
    DT_OVERLAY_CONFIG:append = " dtparam=audio=off"
    RPI_EXTRA_CONFIG += " \n\
    dtoverlay=spi0-2cs,cs0_pin=8,cs1_pin=7 \n\
    dtparam=pwm=on \n\
    dtoverlay=pwm-2chan \n\
    dtparam=pin=18,func=2 \n\
    dtparam=pin2=19,func2=2 \n\
    "
    RPI_EXTRA_CONFIG += " \n\
    gpio=18=a5 \n\
    "
    KERNEL_MODULE_AUTOLOAD += " pwm-bcm2835 spi-bcm2835 spidev i2c-dev i2c-bcm2835"

  # --- RAUC / U-Boot (OTA A/B) ---
  rauc: |
    DISTRO_FEATURES:append = " rauc"
    RPI_USE_U_BOOT = "1"
