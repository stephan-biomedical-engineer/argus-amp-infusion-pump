# ---------------------------------------------------------------------------
# systemd-networkd-wait-online: esperar QUALQUER interface, nao todas
# ---------------------------------------------------------------------------
# O padrao e esperar TODAS as interfaces gerenciadas pelo networkd ficarem
# online. Nesta placa sao duas -- wlan0 (25-wlan.network) e eth0, que o
# 80-wired.network do proprio systemd captura por Type=ether.
#
# Numa instalacao sem cabo, o eth0 fica em NO-CARRIER para sempre. O
# wait-online espera o timeout inteiro (120 s) e falha. Como o mosquitto
# tem After=network-online.target e o infusion-pump tem
# Requires=mosquitto.service, a cadeia toda so sobe DOIS MINUTOS depois do
# boot -- e nesse intervalo o servico aparece como "inactive (dead)" sem
# nenhuma linha no journal, o que parece defeito e nao e.
#
# Com --any, o target e liberado assim que a primeira interface sobe.
# Para um dispositivo que pode operar so em Wi-Fi, e o comportamento
# correto: exigir cabo seria exigir hardware que a instalacao nao tem.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any
