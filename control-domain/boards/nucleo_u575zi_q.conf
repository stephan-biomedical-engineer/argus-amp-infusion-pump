# =====================================================================
# Nucleo-U575ZI-Q - perfil MINIMO (comunicacao + debug)
#
# Objetivo deste target: validar SPI escravo + DATA READY contra a
# RPi Zero 2W, com log legivel pela VCP do ST-Link. PWM do motor
# incluido, mas opcional (ver overlay).
# =====================================================================

# --- Perifericos NAO usados neste perfil ---
# Explicitos para documentar a intencao, nao por necessidade.
CONFIG_ADC=n
CONFIG_SENSOR=n
CONFIG_INPUT=n

# --- SPI escravo em modo interrupcao ---
# O GPDMA do U5 tem binding/celulas diferentes do DMA2 do F4. A 500 kHz
# com quadros de 64 bytes o modo interrupcao atende com folga.
# Para experimentar DMA depois: ligar as duas linhas abaixo E acrescentar
# a propriedade "dmas" no no &spi1 do overlay (formato GPDMA, nao DMA2).
CONFIG_DMA=n
CONFIG_SPI_STM32_DMA=n
CONFIG_SPI_STM32_INTERRUPT=y

# API assincrona do SPI: necessaria para armar o periferico ANTES de subir
# o READY. Sem ela o hub cai no caminho bloqueante, que tem a corrida
# medida no analisador logico (ANALISADOR_LOGICO.md, 3.5).
CONFIG_SPI_ASYNC=n
#            ^^^ OBRIGATORIO. Sem DMA E sem interrupcao, o driver
# spi_stm32 opera em POLLING: spi_transceive() vira busy-wait esperando
# o clock do mestre. Em modo peripheral isso trava o sistema inteiro --
# a thread do hub (prio 1) nunca cede a CPU e nada de prioridade menor
# roda (logic engine, processamento de log, system workqueue).

# --- OTA via MCUboot ---
# Habilitado para exercitar o caminho de atualizacao do firmware pelo
# gateway (stm32-updater, que fala o protocolo OTA por SPI).
#
# O bootloader e construido junto pelo sysbuild:
#     west build -p always -b nucleo_u575zi_q --sysbuild .
#
# Layout de flash vem da propria board DTS: mcuboot 64K, slot0 928K
# @0x10000, slot1 928K @0xf8000. O overlay aponta zephyr,code-partition
# para o slot0, senao a aplicacao seria linkada no inicio da flash e o
# MCUboot nao a encontraria.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y

# =====================================================================
# UART DE DEBUG
#
# Sai pela VCP do ST-Link (a DTS da board ja escolhe o UART certo).
# Sem fiacao extra: plugue o USB da Nucleo e abra
#
#     picocom -b 115200 /dev/ttyACM0
# =====================================================================
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Modo deferido: o log NAO bloqueia a thread do hub enquanto imprime.
# Isso importa aqui -- em modo imediato a UART injetaria latencia no
# laco do SPI e contaminaria qualquer medida de tempo.
CONFIG_LOG_MODE_DEFERRED=y

# Timestamp nas linhas de log, para casar o console com as capturas do
# analisador logico.
CONFIG_LOG_TIMESTAMP_64BIT=y

# Nome das threads nos backtraces e nos erros de kernel.
CONFIG_THREAD_NAME=y

# Falhas de kernel imprimem stack trace legivel em vez de travar mudo.
CONFIG_ASSERT=y
# CONFIG_EXCEPTION_STACK_TRACE nao entra aqui: depende de ARCH_STACKWALK,
# que e 'n' neste arch. Pedir mesmo assim so gera warning e nao ativa nada.

# --- Verbosidade ---
# Padrao INF (herdado do prj.conf). Para bring-up do SPI, subir para DBG
# descomentando a linha abaixo. Cuidado: gera bastante trafego na UART.
# CONFIG_LOG_DEFAULT_LEVEL=4

# --- Shell interativo (opcional) ---
# Util para inspecionar estado sem recompilar. Custa uma thread e ~10 KB.
# CONFIG_SHELL=y
# CONFIG_SHELL_BACKEND_SERIAL=y
