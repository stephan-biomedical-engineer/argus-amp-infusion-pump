# =====================================================================
# Blackpill F411CE - perfil COMPLETO (hardware original do artigo)
#
# Reproduz exatamente a configuracao da branch state_machine: ADC,
# encoder por quadratura, DMA no SPI e OTA via MCUboot.
# =====================================================================

# Entrada (botoes / microswitch)
CONFIG_INPUT=y

# ADC (bolha, oclusao, potenciometro)
CONFIG_ADC=y
CONFIG_ADC_STM32=y

# Encoder por quadratura (TIM1 via API de sensor)
CONFIG_SENSOR=y

# DMA no SPI escravo
CONFIG_DMA=y
CONFIG_SPI_STM32_DMA=y

# Bootloader e DFU (OTA a partir do gateway)
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y

# Assinatura da imagem
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="bootloader/mcuboot/root-rsa-2048.pem"
