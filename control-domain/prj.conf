# =====================================================================
# Argus MPCS - configuracao COMUM a todos os targets
#
# O que e especifico de placa (ADC, encoder, DMA, MCUboot, chave de
# assinatura) mora em boards/<board>.conf, aplicado por cima deste.
# =====================================================================

# Perifericos basicos
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y

# SPI (escravo) - o backend DMA e decidido por placa
CONFIG_SPI=y
CONFIG_SPI_PERIPHERAL=y
CONFIG_SPI_STM32=y

# PWM do motor de passo
CONFIG_PWM=y
CONFIG_PWM_STM32=y

# Lib C
#
# Picolibc. O firmware original pedia newlib, mas NEWLIB_LIBC depende de
# NEWLIB_LIBC_SUPPORTED e o Zephyr SDK 1.0.1 nao traz mais newlib para
# arm-zephyr-eabi: o pedido era silenciosamente ignorado e o picolibc
# vencia a escolha de qualquer jeito. Agora esta explicito.
#
# Seguro aqui: o codigo nao usa %f/%g em nenhum log (picolibc nao traz
# printf de ponto flutuante por padrao) nem funcao alguma de math.h.
CONFIG_PICOLIBC=y

# Logs (otimizado para performance: modo deferido)
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_DEFAULT_LEVEL=3

# Stacks
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=4096

# Instrumentacao de tempo (metricas para os revisores)
# k_cycle_get_32() usa o contador de ciclos do proprio nucleo no
# Cortex-M: resolucao sub-microssegundo, custo de uma leitura de
# registrador. Nao ha amostragem nem buffer no caminho critico.
CONFIG_TIMING_FUNCTIONS=y

# Utils
CONFIG_CRC=y
CONFIG_POLL=y
CONFIG_REBOOT=y

# Workqueue cooperativa: o reboot pos-OTA e agendado nela e nao pode
# ser preemptado pela thread do hub.
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=-1
