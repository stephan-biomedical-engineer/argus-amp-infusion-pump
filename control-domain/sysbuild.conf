# ---------------------------------------------------------------------------
# sysbuild: construir o MCUboot junto com a aplicacao
# ---------------------------------------------------------------------------
# CONFIG_BOOTLOADER_MCUBOOT (no prj/board conf) diz apenas "esta aplicacao
# sera carregada por um bootloader": faz a app ser linkada no slot0 e
# assinada. Nao constroi bootloader nenhum.
#
# Quem manda o sysbuild COMPILAR o MCUboot e este SB_CONFIG. Sem ele, o
# build termina sem bootloader e a placa nao da boot: o vetor de reset
# aponta para o inicio da flash, onde nao ha nada.
#
#   west build -p always -b nucleo_u575zi_q --sysbuild .
SB_CONFIG_BOOTLOADER_MCUBOOT=y
